<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Bribe The Band — Set Viewer</title>
<!-- If added to an iPad/iPhone home screen, launches without Safari's address bar for a true full-screen view -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root {
    --bg: #0c0d13;
    --card: #1b1e2b;
    --accent: #f2b134;
    --accent-dark: #d99a1f;
    --text: #f4f4f6;
    --muted: #9a9db0;
    --danger: #e0616b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  #app { position: relative; height: 100%; overflow: hidden; }

  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #232741;
    background: rgba(27, 30, 43, 0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    gap: 10px;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  header.chrome-hidden {
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
  }
  .song-info { min-width: 0; }
  .song-info .title { font-weight: 700; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-info .sub { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
  header .right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .play-badge {
    background: #232741;
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  #exit-btn, #fullscreen-btn {
    background: transparent;
    border: 1px solid #2a2e40;
    color: var(--muted);
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.82rem;
    white-space: nowrap;
  }

  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05060a;
  }
  #page-canvas {
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    background: #fff;
  }

  .click-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 45%;
    cursor: pointer;
    display: flex;
    align-items: center;
    z-index: 2;
  }
  .click-zone.left { left: 0; justify-content: flex-start; }
  .click-zone.right { right: 0; justify-content: flex-end; }
  .click-zone .arrow {
    opacity: 0;
    color: rgba(255,255,255,0.35);
    font-size: 2.2rem;
    padding: 0 14px;
    transition: opacity 0.15s;
    pointer-events: none;
  }
  .click-zone:hover .arrow { opacity: 1; }
  .click-zone.disabled { cursor: default; }
  .click-zone.disabled .arrow { display: none; }

  /* The untouched gap between the two 45%-wide side zones — tapping here
     toggles the header/footer chrome, same as tapping the middle of a page
     in Apple Books. */
  .click-zone.center {
    left: 45%;
    width: 10%;
    z-index: 3;
  }

  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 8px calc(14px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    background: rgba(27, 30, 43, 0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-top: 1px solid #232741;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  footer.chrome-hidden {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }

  .full-screen-message {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    gap: 14px;
    z-index: 5;
  }
  .full-screen-message h2 { margin: 0; font-size: 1.3rem; }
  .full-screen-message p { color: var(--muted); max-width: 420px; margin: 0; line-height: 1.5; }
  .full-screen-message .error-detail { color: var(--danger); font-size: 0.85rem; max-width: 480px; }
  .full-screen-message button {
    background: var(--accent);
    color: #12141c;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .full-screen-message button.secondary {
    background: transparent;
    border: 1px solid #2a2e40;
    color: var(--text);
    font-weight: 400;
  }
  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid #2a2e40;
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">
  <header id="top-bar" class="hidden">
    <div class="song-info">
      <div class="title" id="song-title">—</div>
      <div class="sub" id="song-sub">—</div>
    </div>
    <div class="right">
      <div class="play-badge hidden" id="play-badge">played 0x tonight</div>
      <button id="fullscreen-btn">⛶ Full Screen</button>
      <button id="exit-btn">Exit to Console</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="page-canvas" class="hidden"></canvas>
    <div class="click-zone left" id="zone-prev"><span class="arrow">‹</span></div>
    <div class="click-zone center" id="zone-toggle-chrome"></div>
    <div class="click-zone right" id="zone-next"><span class="arrow">›</span></div>

    <div class="full-screen-message" id="loading-screen">
      <div class="spinner"></div>
      <h2>Loading tonight's set…</h2>
      <p id="loading-detail">Fetching charts from storage.</p>
    </div>

    <div class="full-screen-message hidden" id="no-gig-screen">
      <h2>No active gig right now</h2>
      <p>Start a gig from the console before starting the set.</p>
      <button onclick="exitToConsole()">Back to Console</button>
    </div>

    <div class="full-screen-message hidden" id="end-screen">
      <h2>🎉 End of the set</h2>
      <p id="end-screen-detail">You've swiped through everything in tonight's set.</p>
      <button onclick="restartSet()">Start Over From the Top</button>
      <button class="secondary" onclick="window.location.href='console.html'">Back to Console</button>
    </div>
  </div>

  <footer id="progress-footer" class="hidden">
    Song <span id="song-index">1</span> of <span id="song-count">1</span> · Page <span id="page-index">1</span> of <span id="page-count">1</span> · click/tap sides or use ← →
  </footer>
</div>

<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://ykvpjeiakvgihpxektcf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_g4w52upNnalAllmn8_8vRA_G6Hj-tlM';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const topBar = document.getElementById('top-bar');
  const songTitleEl = document.getElementById('song-title');
  const songSubEl = document.getElementById('song-sub');
  const playBadge = document.getElementById('play-badge');
  const exitBtn = document.getElementById('exit-btn');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const canvas = document.getElementById('page-canvas');
  const ctx = canvas.getContext('2d');
  const zonePrev = document.getElementById('zone-prev');
  const zoneNext = document.getElementById('zone-next');
  const zoneToggleChrome = document.getElementById('zone-toggle-chrome');
  const loadingScreen = document.getElementById('loading-screen');
  const loadingDetail = document.getElementById('loading-detail');
  const noGigScreen = document.getElementById('no-gig-screen');
  const endScreen = document.getElementById('end-screen');
  const progressFooter = document.getElementById('progress-footer');
  const songIndexEl = document.getElementById('song-index');
  const songCountEl = document.getElementById('song-count');
  const pageIndexEl = document.getElementById('page-index');
  const pageCountEl = document.getElementById('page-count');

  let performer = null;
  let gig = null;
  let orderedSongs = [];   // songs in gig.runtime_order, in order, minus any that no longer exist
  let pageStream = [];     // flat list: { song, pdf (proxy or null), pageNum, isFirstPageOfSong, isLastPageOfSong, loadError }
  let currentIndex = 0;
  let playCounts = {};     // song_id -> count of plays recorded so far tonight
  let atEnd = false;
  let chromeHideTimer = null;
  const CHROME_AUTO_HIDE_MS = 3000;

  // Header/footer behave like Apple Books' top bar: visible briefly, then
  // fade away so the chart can fill the whole screen, reappearing on a tap
  // in the middle of the page (or on any real navigation).
  function showChrome(autoHideAfter) {
    topBar.classList.remove('chrome-hidden');
    progressFooter.classList.remove('chrome-hidden');
    clearTimeout(chromeHideTimer);
    if (autoHideAfter !== false) {
      chromeHideTimer = setTimeout(hideChrome, CHROME_AUTO_HIDE_MS);
    }
  }
  function hideChrome() {
    clearTimeout(chromeHideTimer);
    topBar.classList.add('chrome-hidden');
    progressFooter.classList.add('chrome-hidden');
  }
  function toggleChrome() {
    if (topBar.classList.contains('chrome-hidden')) showChrome();
    else hideChrome();
  }

  window.exitToConsole = function () {
    // The viewer opens in its own tab from the console, so closing it
    // returns you to the console tab directly. If the browser won't allow
    // a script-closed tab (e.g. this page wasn't opened via window.open,
    // such as a bookmark or typed URL), fall back to navigating there.
    window.close();
    setTimeout(() => { window.location.href = 'console.html'; }, 150);
  };

  exitBtn.addEventListener('click', exitToConsole);

  window.restartSet = function () {
    atEnd = false;
    endScreen.classList.add('hidden');
    goToIndex(0, { record: false });
  };

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'console.html';
      return;
    }

    const { data: { user } } = await supabase.auth.getUser();
    const { data: perf, error: perfError } = await supabase
      .from('performers')
      .select('id, handle, display_name')
      .eq('auth_user_id', user.id)
      .maybeSingle();
    if (perfError || !perf) {
      window.location.href = 'console.html';
      return;
    }
    performer = perf;

    const { data: gigData } = await supabase
      .from('gig_sessions')
      .select('id, gig_code, runtime_order, active_setlist_id, status')
      .eq('performer_id', performer.id)
      .eq('status', 'active')
      .order('created_at', { ascending: false })
      .maybeSingle();

    if (!gigData || !gigData.runtime_order || gigData.runtime_order.length === 0) {
      showOnly(noGigScreen);
      return;
    }
    gig = gigData;

    const { data: songRows } = await supabase
      .from('songs')
      .select('id, title, artist, song_key, key_with_capo, chart_url')
      .eq('performer_id', performer.id)
      .in('id', gig.runtime_order);

    const songById = {};
    (songRows || []).forEach(s => { songById[s.id] = s; });
    orderedSongs = gig.runtime_order.map(id => songById[id]).filter(Boolean);

    if (orderedSongs.length === 0) {
      showOnly(noGigScreen);
      return;
    }

    await loadExistingPlayCounts();
    await buildPageStream();

    if (pageStream.length === 0) {
      loadingDetail.textContent = 'None of tonight\'s charts could be loaded.';
      return;
    }

    topBar.classList.remove('hidden');
    progressFooter.classList.remove('hidden');
    canvas.classList.remove('hidden');
    loadingScreen.classList.add('hidden');

    showChrome();
    await goToIndex(0, { record: false });
  }

  function showOnly(screenEl) {
    [loadingScreen, noGigScreen, endScreen].forEach(el => el.classList.add('hidden'));
    screenEl.classList.remove('hidden');
  }

  async function loadExistingPlayCounts() {
    const { data } = await supabase
      .from('song_plays')
      .select('song_id')
      .eq('gig_session_id', gig.id);
    playCounts = {};
    (data || []).forEach(row => {
      playCounts[row.song_id] = (playCounts[row.song_id] || 0) + 1;
    });
  }

  async function buildPageStream() {
    pageStream = [];
    for (let i = 0; i < orderedSongs.length; i++) {
      const song = orderedSongs[i];
      loadingDetail.textContent = `Loading chart ${i + 1} of ${orderedSongs.length}: ${song.title}…`;
      try {
        const loadingTask = window.pdfjsLib.getDocument(song.chart_url);
        const pdf = await loadingTask.promise;
        for (let p = 1; p <= pdf.numPages; p++) {
          pageStream.push({
            song,
            pdf,
            pageNum: p,
            isFirstPageOfSong: p === 1,
            isLastPageOfSong: p === pdf.numPages,
          });
        }
      } catch (err) {
        console.error(`Could not load chart for "${song.title}"`, err);
        pageStream.push({
          song,
          pdf: null,
          pageNum: 1,
          isFirstPageOfSong: true,
          isLastPageOfSong: true,
          loadError: err && err.message ? err.message : 'Could not load this chart.',
        });
      }
    }
  }

  async function renderCurrentPage() {
    const entry = pageStream[currentIndex];
    if (!entry) return;

    songTitleEl.textContent = entry.song.title;
    const keyBits = [];
    if (entry.song.song_key) keyBits.push(entry.song.song_key);
    if (entry.song.key_with_capo && !/^\s*no capo\s*$/i.test(entry.song.key_with_capo)) {
      keyBits.push(entry.song.key_with_capo);
    }
    songSubEl.textContent = [entry.song.artist, keyBits.join(' · ')].filter(Boolean).join(' — ') || '—';

    const count = playCounts[entry.song.id] || 0;
    if (count > 0) {
      playBadge.textContent = `played ${count}x tonight`;
      playBadge.classList.remove('hidden');
    } else {
      playBadge.classList.add('hidden');
    }

    const songIdx = orderedSongs.findIndex(s => s.id === entry.song.id);
    songIndexEl.textContent = songIdx + 1;
    songCountEl.textContent = orderedSongs.length;
    pageIndexEl.textContent = entry.pageNum;
    pageCountEl.textContent = entry.pdf ? entry.pdf.numPages : 1;

    zonePrev.classList.toggle('disabled', currentIndex === 0);

    if (entry.loadError) {
      canvas.classList.add('hidden');
      loadingScreen.classList.remove('hidden');
      loadingScreen.querySelector('.spinner').classList.add('hidden');
      loadingDetail.innerHTML = `Couldn't load the chart for <strong>${escapeHtml(entry.song.title)}</strong>.<br><span style="color:var(--danger);font-size:0.8rem;">${escapeHtml(entry.loadError)}</span><br><br>Use the arrows or click the sides to skip ahead.`;
      return;
    }
    loadingScreen.classList.add('hidden');
    canvas.classList.remove('hidden');
    loadingScreen.querySelector('.spinner').classList.remove('hidden');

    const page = await entry.pdf.getPage(entry.pageNum);
    const stageEl = document.getElementById('stage');
    const availableWidth = stageEl.clientWidth * 0.96;
    const availableHeight = stageEl.clientHeight * 0.97;
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = Math.min(availableWidth / baseViewport.width, availableHeight / baseViewport.height);
    const viewport = page.getViewport({ scale: Math.max(scale, 0.1) });

    // Render at the screen's real pixel density (Retina/iPad displays are
    // typically 2x or 3x) so the chart is crisp instead of stretched — the
    // canvas's CSS size stays the same, only its backing pixel buffer grows.
    const outputScale = window.devicePixelRatio || 1;
    canvas.width = Math.floor(viewport.width * outputScale);
    canvas.height = Math.floor(viewport.height * outputScale);
    canvas.style.width = Math.floor(viewport.width) + 'px';
    canvas.style.height = Math.floor(viewport.height) + 'px';
    const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : undefined;

    await page.render({ canvasContext: ctx, viewport, transform }).promise;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  async function recordPlay(songId) {
    playCounts[songId] = (playCounts[songId] || 0) + 1;
    try {
      await supabase.from('song_plays').insert({ gig_session_id: gig.id, song_id: songId });
    } catch (err) {
      console.error('Could not record play', err);
      // Not fatal to the live performance — the performer keeps moving either way.
    }
  }

  async function goToIndex(newIndex, opts) {
    const options = opts || { record: true };
    if (newIndex < 0) return;

    if (newIndex >= pageStream.length) {
      // Reached the very end — the last page's song still counts as played.
      const leaving = pageStream[currentIndex];
      if (options.record !== false && leaving && leaving.isLastPageOfSong && !leaving.loadError) {
        await recordPlay(leaving.song.id);
      }
      atEnd = true;
      showOnly(endScreen);
      return;
    }

    if (options.record !== false && newIndex > currentIndex) {
      const leaving = pageStream[currentIndex];
      const entering = pageStream[newIndex];
      if (leaving && !leaving.loadError && leaving.isLastPageOfSong && entering.song.id !== leaving.song.id) {
        await recordPlay(leaving.song.id);
      }
    }

    currentIndex = newIndex;
    await renderCurrentPage();
  }

  function nextPage() {
    if (atEnd) return;
    goToIndex(currentIndex + 1);
  }
  function prevPage() {
    if (atEnd) return;
    goToIndex(currentIndex - 1, { record: false });
  }

  zoneNext.addEventListener('click', nextPage);
  zonePrev.addEventListener('click', prevPage);
  zoneToggleChrome.addEventListener('click', toggleChrome);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextPage();
    if (e.key === 'ArrowLeft') prevPage();
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (!atEnd) renderCurrentPage(); }, 150);
  });
  // iOS fires 'resize' on rotation too, but 'orientationchange' fires first
  // and more reliably — re-render on both so a rotate never leaves a
  // stale/undersized page behind.
  window.addEventListener('orientationchange', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (!atEnd) renderCurrentPage(); }, 300);
  });

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function updateFullscreenBtnLabel() {
    fullscreenBtn.textContent = isFullscreen() ? '⛶ Exit Full Screen' : '⛶ Full Screen';
  }

  fullscreenBtn.addEventListener('click', async () => {
    const el = document.documentElement;
    try {
      if (!isFullscreen()) {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); // Safari/iPadOS
      } else {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (err) {
      // iPhone Safari (unlike iPadOS) doesn't support the Fullscreen API at
      // all for arbitrary elements — fails silently here. Adding the page
      // to the home screen (see the apple-mobile-web-app meta tags) is the
      // fallback way to get a chrome-free view on those devices.
      console.warn('Fullscreen request failed', err);
    }
  });

  document.addEventListener('fullscreenchange', updateFullscreenBtnLabel);
  document.addEventListener('webkitfullscreenchange', updateFullscreenBtnLabel);

  init();
</script>

</body>
</html>
