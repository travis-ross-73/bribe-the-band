<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bribe The Band</title>
<link rel="manifest" href="/manifest.json" />
<style>
  :root {
    --bg: #12141c;
    --card: #1b1e2b;
    --accent: #f2b134;
    --accent-dark: #d99a1f;
    --text: #f4f4f6;
    --muted: #9a9db0;
    --success: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 28px 20px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 1.8rem;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }
  #status-banner {
    background: var(--card);
    border: 1px solid #2a2e40;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
  }
  #search {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a2e40;
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 16px;
  }
  #search:focus { outline: 2px solid var(--accent); }
  .song-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .song-row {
    background: var(--card);
    border: 1px solid #2a2e40;
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .song-row:hover { border-color: var(--accent); }
  .song-row.selected { border-color: var(--accent); background: #232741; }
  .song-title { font-weight: 600; font-size: 1rem; }
  .song-artist { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .song-key {
    font-size: 0.78rem;
    color: var(--accent);
    border: 1px solid var(--accent-dark);
    border-radius: 6px;
    padding: 2px 8px;
    white-space: nowrap;
  }

  #request-panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--card);
    border-top: 1px solid #2a2e40;
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(105%);
    transition: transform 0.25s ease;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
  }
  #request-panel.open { transform: translateY(0); }
  #request-panel h2 { margin: 0 0 4px; font-size: 1.1rem; }
  #request-panel .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
  .tip-options {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tip-btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 8px;
    border: 1px solid #2a2e40;
    background: #12141c;
    color: var(--text);
    font-size: 0.95rem;
    cursor: pointer;
  }
  .tip-btn.selected { background: var(--accent); color: #12141c; border-color: var(--accent); font-weight: 700; }
  #note-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2a2e40;
    background: #12141c;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  #submit-request {
    width: 100%;
    padding: 14px 0;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #12141c;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
  }
  #submit-request:disabled { opacity: 0.5; cursor: default; }
  #cancel-request {
    display: block;
    text-align: center;
    margin-top: 10px;
    color: var(--muted);
    font-size: 0.85rem;
    cursor: pointer;
  }
  #confirmation {
    text-align: center;
    padding: 40px 20px;
  }
  #confirmation h2 { color: var(--success); }
  .hidden { display: none !important; }
  .note-hint { color: var(--muted); font-size: 0.75rem; margin: -8px 0 12px; }
</style>
</head>
<body>

<header>
  <h1>🎤 Bribe The Band</h1>
  <p>Pick a song, add a tip, make it happen.</p>
</header>

<main>
  <div id="status-banner">Loading songs…</div>
  <input type="text" id="search" placeholder="Search songs or artists…" />
  <div class="song-list" id="song-list"></div>
</main>

<div id="request-panel">
  <h2 id="panel-song-title">Song Title</h2>
  <div class="subtitle" id="panel-song-artist">Artist</div>

  <div class="tip-options" id="tip-options">
    <button class="tip-btn" data-amount="5">$5</button>
    <button class="tip-btn" data-amount="10">$10</button>
    <button class="tip-btn" data-amount="20">$20</button>
    <button class="tip-btn" data-amount="0">No tip</button>
  </div>

  <input type="text" id="note-input" placeholder="Add a note (optional) — no names, please" maxlength="120" />
  <div class="note-hint">Notes are shown to the performer — please don't include names.</div>

  <button id="submit-request">Send Request</button>
  <div id="cancel-request">Cancel</div>
</div>

<div id="confirmation" class="hidden">
  <h2>Request sent! 🎶</h2>
  <p>The band has your request — thanks for the tip!</p>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // --- Config ---------------------------------------------------------
  const SUPABASE_URL = 'https://ykvpjeiakvgihpxektcf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_g4w52upNnalAllmn8_8vRA_G6Hj-tlM';
  // Gig code comes from the URL, e.g. bribetheband.live/?gig=TEST1
  // Falls back to TEST1 for local/testing use.
  const params = new URLSearchParams(window.location.search);
  const gigCode = params.get('gig') || 'TEST1';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --- State ------------------------------------------------------------
  let songs = [];
  let gigSession = null;
  let selectedSong = null;
  let selectedTip = null;

  const statusBanner = document.getElementById('status-banner');
  const songListEl = document.getElementById('song-list');
  const searchEl = document.getElementById('search');
  const panel = document.getElementById('request-panel');
  const panelTitle = document.getElementById('panel-song-title');
  const panelArtist = document.getElementById('panel-song-artist');
  const tipOptions = document.getElementById('tip-options');
  const noteInput = document.getElementById('note-input');
  const submitBtn = document.getElementById('submit-request');
  const cancelBtn = document.getElementById('cancel-request');
  const confirmation = document.getElementById('confirmation');

  async function init() {
    // Look up the active gig session by its code
    const { data: gigData, error: gigError } = await supabase
      .from('gig_sessions')
      .select('id, gig_code, status, performer_id')
      .eq('gig_code', gigCode)
      .eq('status', 'active')
      .maybeSingle();

    if (gigError || !gigData) {
      statusBanner.textContent = `No active gig found for code "${gigCode}". Ask the performer for the right link.`;
      return;
    }
    gigSession = gigData;

    const { data: songData, error: songError } = await supabase
      .from('songs')
      .select('id, title, artist, song_key, key_with_capo, chart_url')
      .eq('performer_id', gigSession.performer_id)
      .order('title');

    if (songError) {
      statusBanner.textContent = 'Could not load songs. Please try again.';
      console.error(songError);
      return;
    }

    songs = songData;
    statusBanner.classList.add('hidden');
    renderSongs(songs);
  }

  function renderSongs(list) {
    songListEl.innerHTML = '';
    if (list.length === 0) {
      songListEl.innerHTML = '<div style="color:var(--muted); text-align:center; padding:20px;">No songs match your search.</div>';
      return;
    }
    for (const song of list) {
      const row = document.createElement('div');
      row.className = 'song-row';
      row.innerHTML = `
        <div>
          <div class="song-title">${escapeHtml(song.title)}</div>
          <div class="song-artist">${escapeHtml(song.artist)}</div>
        </div>
        <div class="song-key">${escapeHtml(song.song_key || '')}</div>
      `;
      row.addEventListener('click', () => openRequestPanel(song));
      songListEl.appendChild(row);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  searchEl.addEventListener('input', () => {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = songs.filter(s =>
      s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)
    );
    renderSongs(filtered);
  });

  function openRequestPanel(song) {
    selectedSong = song;
    selectedTip = null;
    panelTitle.textContent = song.title;
    panelArtist.textContent = song.artist;
    noteInput.value = '';
    [...tipOptions.children].forEach(btn => btn.classList.remove('selected'));
    submitBtn.disabled = true;
    panel.classList.add('open');
  }

  tipOptions.addEventListener('click', (e) => {
    const btn = e.target.closest('.tip-btn');
    if (!btn) return;
    [...tipOptions.children].forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedTip = parseFloat(btn.dataset.amount);
    submitBtn.disabled = false;
  });

  cancelBtn.addEventListener('click', () => {
    panel.classList.remove('open');
  });

  submitBtn.addEventListener('click', async () => {
    if (!selectedSong || selectedTip === null || !gigSession) return;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    const { error } = await supabase.from('requests').insert({
      gig_session_id: gigSession.id,
      song_id: selectedSong.id,
      tip_amount: selectedTip,
      note: noteInput.value.trim() || null,
      status: 'pending'
    });

    if (error) {
      console.error(error);
      submitBtn.textContent = 'Send Request';
      submitBtn.disabled = false;
      alert('Something went wrong sending your request. Please try again.');
      return;
    }

    panel.classList.remove('open');
    document.querySelector('main').classList.add('hidden');
    confirmation.classList.remove('hidden');
  });

  init();
</script>

</body>
</html>
